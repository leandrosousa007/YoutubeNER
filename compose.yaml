services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      YOUTUBENER_PRODUCTION: "1"
      YOUTUBENER_WEB_ORIGIN: https://${APP_HOST:?defina APP_HOST}
      YOUTUBENER_DATA_DIR: /data
    volumes:
      - ./data:/data
    expose: ["8000"]
    restart: unless-stopped
  https:
    image: caddy:2
    environment:
      APP_HOST: ${APP_HOST:?defina APP_HOST}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    ports: ["80:80", "443:443"]
    depends_on: [app]
    restart: unless-stopped
volumes:
  caddydata:
  caddyconfig:
